<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Portfólio - Claudio</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.cdnfonts.com/css/jack-frost" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/tysla" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <div class="parallax-bg"></div>

    <main class="content">
        <section id="intro" class="fade-in-section">
            <div class="header">
                <h3>codename: Claudsaints</h3>
            </div>

            <h1 class="big-title" id="main-title"></h1>

            <div class="section about-section">
                <img class="character" src="./assets/teste_profile.png" alt="Perfil" />
                <div>
                    <h2>Sobre</h2>
                    <p>
                        Olá, meu nome é Claudio. Sou um desenvolvedor de software apaixonado por criar soluções inovadoras.
                    </p>
                </div>
            </div>
        </section>

        <hr />

        <section id="projects-container" class="fade-in-section">
            <h1>Projetos</h1>
            <div class="project-filter">
                <button id="btn-academic" class="active">Acadêmicos</button>
                <button id="btn-personal">Pessoais</button>
            </div>
            <div class="projects-section" id="projects-grid"></div>
        </section>

        <hr />

        <section id="contact" class="fade-in-section">
            <h1>Contato</h1>
            <div class="contato">
                <div class="contato-link">
                    <p><span>Linkedin:</span></p>
                    <a target="_blank" href="https://www.linkedin.com/in/claudio-siqueira-dev/">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linkedin/linkedin-original.svg" width="32" alt="LinkedIn Icon" />
                    </a>
                </div>
                <hr class="contact-hr" />
                <div class="contato-link">
                    <p><span>Github:</span></p>
                    <a target="_blank" href="https://github.com/claudsaints">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" width="32" alt="GitHub Icon" />
                    </a>
                </div>
                <hr class="contact-hr" />

            </div>
        </section>
    </main>

    <footer>
        <p id="time-display"></p>
    </footer>

    <script src="projects.js"></script>
    <script src="effects.js"></script>
    <script src="scroll-fade.js"></script>
    
</body>
</html>
